<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LuzeX RSLNT</title>
  <meta name="theme-color" content="#cfc6bc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RSLNT" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="app">
  <header id="balk"></header>

  <main class="app-kolom">
    <div class="app-kop">
      <p class="kicker" id="vandaag-datum">Vandaag</p>
      <h1 id="kop">Vandaag</h1>
    </div>

    <!-- Nieuw account zonder schema: één duidelijke eerste stap. -->
    <section class="panel welkom-paneel" id="welkom-paneel" hidden>
      <h2>Je eerste stap</h2>
      <p class="subtitle">Vertel kort wat je wilt en hoeveel tijd je hebt. RSLNT maakt er een schema bij. Duurt een paar minuten.</p>
      <a class="knop-link knop-groot" href="/start.html">Maak mijn schema</a>
    </section>

    <!-- 1. Je week -->
    <a class="panel week-strip" id="week-strip" href="/week.html" hidden aria-label="Je week bekijken"></a>

    <!-- 2. Je training van vandaag, met het advies en wat er verder vandaag is -->
    <section class="panel workout" id="training-paneel" hidden>
      <p class="kicker" id="workout-kicker">Vandaag</p>
      <h2 class="workout-titel" id="workout-titel"></h2>
      <p class="workout-meta" id="workout-meta"></p>
      <div class="advies" id="advies" hidden></div>
      <button class="knop-groot" id="start-knop" hidden></button>
      <p class="error" id="start-fout" role="alert"></p>
      <div class="workout-extra" id="workout-extra"></div>
      <details class="meer-opties" id="meer-opties">
        <summary>Meer opties</summary>
        <div class="meer-lijst" id="meer-lijst"></div>
      </details>
    </section>

    <!-- 3. Herstelcheck: alleen op een trainingsdag, of als er iets is om op te letten -->
    <section class="panel herstel-kaart" id="herstel-paneel" hidden>
      <div class="herstel-dicht" id="herstel-dicht" hidden>
        <div>
          <h2>Hoe voel je je?</h2>
          <p class="lijst-meta">4 tikken, dan past het advies zich aan.</p>
        </div>
        <button type="button" class="secondary" id="herstel-open">Invullen</button>
      </div>
      <form id="herstel-form" novalidate hidden>
        <div class="panel-kop"><h2>Hoe voel je je?</h2><a class="text-link" href="/wetenschap.html#herstel">Waarom?</a></div>
        <div id="herstel-rijen"></div>
        <button type="submit" class="ruimte-boven" id="herstel-opslaan" disabled>Opslaan</button>
      </form>
      <div id="herstel-signalen" hidden></div>
      <p class="error" id="herstel-fout" role="alert"></p>
    </section>

    <!-- 4. Recente trainingen -->
    <section class="panel" id="recent-paneel">
      <h2>Recent</h2>
      <ul class="lijst" id="recent"></ul>
    </section>

    <section class="panel" id="wens-kaart" hidden></section>
  </main>

  <script src="/common.js"></script>
  <script src="/vandaag.js"></script>
  <script src="/rondleiding.js"></script>
</body>
</html>

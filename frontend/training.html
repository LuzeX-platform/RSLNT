<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Training — LuzeX RSLNT</title>
  <meta name="theme-color" content="#cfc6bc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RSLNT" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="app">
  <header id="balk"></header>

  <main class="app-kolom">
    <div class="app-kop">
      <p class="kicker" id="kicker">Training</p>
      <h1 id="kop">Laden…</h1>
      <p class="subtitle" id="ondertitel"></p>
    </div>

    <section class="panel" id="vooruitblik" hidden>
      <h2>Volgende keer</h2>
      <p class="subtitle">Het voorstel voor de volgende keer dat je deze training doet.</p>
      <ul class="lijst" id="vooruitblik-lijst"></ul>
    </section>

    <div id="oefeningen"></div>

    <section class="panel notitie" id="notitie-paneel" hidden>
      <h2>Notitie</h2>
      <p class="subtitle">Hoe ging het? Knie, energie, techniek.</p>
      <label for="notitie" hidden>Notitie</label>
      <textarea id="notitie"></textarea>
    </section>

    <button class="knop-groot" id="afronden" hidden>Training afronden</button>
    <p class="error" id="fout" role="alert"></p>
    <div class="knop-rij" id="beheer" hidden>
      <button class="text-link" id="heropenen" hidden>Training heropenen</button>
      <button class="text-link gevaar-link" id="verwijderen">Training verwijderen</button>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/training.js"></script>
</body>
</html>

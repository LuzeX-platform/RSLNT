<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wachtwoord vergeten — LuzeX RSLNT</title>
  <meta name="description" content="Stel een nieuw wachtwoord in voor LuzeX RSLNT." />
  <meta name="theme-color" content="#cfc6bc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RSLNT" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-pagina="wachtwoord-vergeten">
  <header id="balk"></header>

  <main class="auth-kolom">
    <div class="panel auth-kaart">
      <h1>Wachtwoord vergeten</h1>
      <p class="subtitle">Vul je e-mailadres in. Je krijgt een link om een nieuw wachtwoord in te stellen.</p>
      <form id="formulier" novalidate>
        <label for="email">E-mailadres</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <button type="submit">Link versturen</button>
        <p class="error" id="fout" role="alert"></p>
        <p class="success" id="succes" role="status"></p>
      </form>
      <p class="auth-voet"><a href="/inloggen.html">Terug naar inloggen</a></p>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/auth.js"></script>
</body>
</html>

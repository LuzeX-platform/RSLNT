<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Inloggen — LuzeX RSLNT</title>
  <meta name="theme-color" content="#cfc6bc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RSLNT" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="balk"></header>

  <main class="auth-kolom">
    <div class="panel auth-kaart">
      <h1>Inloggen</h1>
      <p class="subtitle">Trainen, herstellen, groeien.</p>
      <form id="formulier" novalidate>
        <label for="email">E-mailadres</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="wachtwoord">Wachtwoord</label>
        <input id="wachtwoord" name="wachtwoord" type="password" autocomplete="current-password" required />
        <button type="submit">Inloggen</button>
        <p class="error" id="fout" role="alert"></p>
      </form>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/inloggen.js"></script>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Account maken — LuzeX RSLNT</title>
  <meta name="description" content="Maak gratis een account bij LuzeX RSLNT." />
  <meta name="theme-color" content="#cfc6bc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RSLNT" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-pagina="registreren">
  <header id="balk"></header>

  <main class="auth-kolom">
    <div class="panel auth-kaart">
      <h1>Account maken</h1>
      <p class="subtitle">Gratis. Je trainingen, je lichaam en je herstel op één plek.</p>
      <form id="formulier" novalidate>
        <label for="naam">Voornaam</label>
        <input id="naam" name="naam" type="text" autocomplete="given-name" required />
        <label for="email">E-mailadres</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="wachtwoord">Wachtwoord</label>
        <input id="wachtwoord" name="wachtwoord" type="password" autocomplete="new-password" minlength="10" required />
        <p class="veld-hint">Minimaal 10 tekens.</p>
        <label class="vinkje toestemming"><input id="toestemming" name="toestemming" type="checkbox" required /> <span>Ik geef toestemming dat RSLNT mijn gezondheidsgegevens (zoals gewicht, lichaamsmaten, pijn en herstel) bewaart om mijn trainingen te begeleiden. Ik heb de <a href="/privacy.html" target="_blank" rel="noopener">privacyverklaring</a> gelezen. Intrekken kan altijd door je account te verwijderen.</span></label>
        <button type="submit">Account maken</button>
        <p class="error" id="fout" role="alert"></p>
      </form>
      <div id="klaar" hidden>
        <p class="melding">Bijna klaar! We hebben je een mail gestuurd. Klik op de link in die mail om je account te bevestigen. Niets ontvangen? Kijk ook in je spam.</p>
      </div>
      <p class="auth-voet">Al een account? <a href="/inloggen.html">Inloggen</a></p>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/auth.js"></script>
</body>
</html>

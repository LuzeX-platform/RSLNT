<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>E-mailadres bevestigen — LuzeX RSLNT</title>
  <meta name="description" content="Bevestig je e-mailadres voor LuzeX RSLNT." />
  <meta name="theme-color" content="#cfc6bc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RSLNT" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-pagina="bevestigen">
  <header id="balk"></header>

  <main class="auth-kolom">
    <div class="panel auth-kaart">
      <h1>E-mailadres bevestigen</h1>
      <p class="subtitle" id="status" role="status">Even geduld…</p>
      <form id="opnieuw" novalidate hidden>
        <label for="email">Stuur een nieuwe bevestigingslink naar</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <button type="submit">Nieuwe link sturen</button>
        <p class="error" id="fout" role="alert"></p>
        <p class="success" id="succes" role="status"></p>
      </form>
      <p class="auth-voet"><a href="/inloggen.html">Naar inloggen</a></p>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/auth.js"></script>
</body>
</html>

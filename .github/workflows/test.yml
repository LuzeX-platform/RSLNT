name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rslnt
          POSTGRES_PASSWORD: rslnt
          POSTGRES_DB: rslnt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://rslnt:rslnt@localhost:5432/rslnt_test
      DATABASE_URL: postgresql://rslnt:rslnt@localhost:5432/rslnt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - name: Frontend-scripts zonder syntaxfouten
        working-directory: frontend
        run: for f in *.js; do node --check "$f"; done
